<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuellaByte - Iniciar sesión</title>
    <link rel="stylesheet" href="huellabyte.css">
</head>

<body>
    <div id="bloque1">
        <h1>HuellaByte</h1>
    </div>
    <div id="div-login">
        <h2>Iniciar sesión</h2>
        <img id="logo" src="imagenes/WhatsApp Image 2026-05-10 at 19.51.01.png" alt="logo" width="160px">
        <form autocomplete="off">
            <p>Usuario: <input type="text" id="usuario" autocomplete="off" placeholder="Ingresá tu usuario"></p>
            <p>Contraseña: <input type="password" id="contrasena" autocomplete="new-password"
                    placeholder="Ingresá tu contraseña"></p>
        </form>
        <button type="button" onclick="iniciarSesion()">ENTRAR</button>
        <button type="button" onclick="borrarLogin()">BORRAR</button>
    </div>
    <script src="huellabyte.js"></script>
</body>

</html>
